name: Reservas Gym

on:
  schedule:
    # Jueves
    - cron: "00 4 * * 4"

  # Permite lanzarlo manualmente desde GitHub (Actions → Run workflow)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid # 🔹 Fuerza la zona horaria a Madrid
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Debug env
        run: |
          echo "APP_USERNAME length: ${#APP_USERNAME}"
          echo "APP_PASSWORD length: ${#APP_PASSWORD}"

      - name: Run script
        run: python programaGym.py
